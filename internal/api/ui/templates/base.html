{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JN-66 {{block "title" .}}{{end}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <style>
    [x-cloak] { display: none !important; }
    .status-auto  { background:#dbeafe; color:#1e40af; }
    .status-manual{ background:#dcfce7; color:#166534; }
    .status-pending{ background:#fef9c3; color:#854d0e; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 text-sm">
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-8">
    <span class="font-semibold text-base tracking-tight">JN-66</span>
    <a href="/ui/transactions" class="text-gray-600 hover:text-gray-900">Transactions</a>
    <a href="/ui/accounts"     class="text-gray-600 hover:text-gray-900">Accounts</a>
    <a href="/ui/investments"  class="text-gray-600 hover:text-gray-900">Investments</a>
    <div class="ml-auto">
      <a href="/ui/logout" class="text-gray-400 hover:text-gray-700 text-xs">Logout</a>
    </div>
  </nav>
  <main class="px-6 py-6 max-w-screen-2xl mx-auto">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>{{end}}
