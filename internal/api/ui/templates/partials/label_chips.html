{{define "label_chips.html"}}
<div id="labels-{{.TxnID}}" class="flex flex-wrap gap-1 items-center" x-data="{open:false}">
  {{range .Labels}}
  <span class="inline-flex items-center gap-1 bg-purple-100 text-purple-700 rounded-full px-2 py-0.5 text-xs">
    {{.Name}}
    <button type="button"
            hx-delete="/ui/transactions/{{$.TxnID}}/label/{{.ID}}"
            hx-target="#labels-{{$.TxnID}}"
            hx-swap="outerHTML"
            class="text-purple-400 hover:text-purple-700 leading-none">×</button>
  </span>
  {{end}}

  <div class="relative" x-data="{v:''}">
    <button type="button" @click="open=!open"
            class="text-gray-400 hover:text-gray-600 text-xs leading-none">+ label</button>
    <div x-show="open" x-cloak @click.outside="open=false"
         class="absolute z-10 mt-1 bg-white border border-gray-200 rounded shadow p-2 w-36">
      <form hx-post="/ui/transactions/{{.TxnID}}/label"
            hx-target="#labels-{{.TxnID}}"
            hx-swap="outerHTML"
            @submit="open=false; v=''"
            class="flex gap-1">
        <input type="text" name="label" x-model="v"
               placeholder="tag name"
               class="border border-gray-200 rounded px-1 py-0.5 text-xs w-full focus:outline-none"
               required>
        <button type="submit" class="text-blue-600 text-xs font-medium">Add</button>
      </form>
    </div>
  </div>
</div>
{{end}}
